name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[test]"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import accio; print(accio.__version__)")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Git tag (v$TAG_VERSION) does not match accio.__version__ ($PKG_VERSION)"
            exit 1
          fi

      - name: Run unit test suite
        run: |
          pytest -v

      - name: Build source tarball (sdist) and wheel
        run: |
          python -m build
          twine check dist/*

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.whl > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release and upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS.txt

